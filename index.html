<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f5f5f5;color:#333;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.header{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;padding:16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.header h1{font-size:22px;margin-bottom:6px}
.header .stats{font-size:13px;opacity:.9}
.tabs{display:flex;background:#fff;border-bottom:2px solid #eee;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab{flex:1;padding:12px 6px;text-align:center;cursor:pointer;font-size:14px;font-weight:600;color:#666;border-bottom:3px solid transparent;transition:all .2s}
.tab:hover{background:#f8f8f8}
.tab.active{color:#e74c3c;border-bottom-color:#e74c3c}
.container{max-width:860px;margin:0 auto;padding:16px 12px}
.group-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.group-title{font-size:17px;font-weight:700;color:#2c3e50}
.group-type{font-size:11px;padding:2px 8px;border-radius:10px;background:#e74c3c;color:#fff;font-weight:600}
.group-type.cy{background:#3498db}
.progress-bar{width:100%;height:5px;background:#e0e0e0;border-radius:3px;margin-bottom:16px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#e74c3c,#e67e22);border-radius:3px;transition:width .3s}
.match-area{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start}
.col{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-label{font-size:12px;color:#999;text-align:center;margin-bottom:2px;font-weight:600;letter-spacing:1px}
.word-card,.def-card{padding:12px 14px;border-radius:10px;cursor:pointer;transition:all .2s;font-size:13.5px;line-height:1.6;border:2px solid transparent;user-select:none;-webkit-user-select:none}
.word-card{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center;font-weight:700;font-size:15px}
.word-card:hover{box-shadow:0 2px 6px rgba(0,0,0,.12)}
.word-card.selected{border-color:#e74c3c;background:#fff5f5;box-shadow:0 0 0 3px rgba(231,76,60,.15)}
.word-card.matched{border-color:#27ae60;background:#f0fff0;opacity:.5;pointer-events:none}
.word-card.wrong{border-color:#e74c3c;background:#ffe0e0;animation:shake .4s}
.def-card{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:13px}
.def-card:hover{box-shadow:0 2px 6px rgba(0,0,0,.12)}
.def-card.selected{border-color:#3498db;background:#f0f8ff;box-shadow:0 0 0 3px rgba(52,152,219,.15)}
.def-card.matched{border-color:#27ae60;background:#f0fff0;opacity:.5;pointer-events:none}
.def-card.wrong{border-color:#e74c3c;background:#ffe0e0;animation:shake .4s}
.freq-tag{display:inline-block;font-size:10px;color:#e74c3c;background:#fde8e8;padding:1px 5px;border-radius:6px;margin-left:4px;font-weight:400;vertical-align:middle}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn:active{transform:scale(.96)}
.btn-primary{background:#e74c3c;color:#fff}
.btn-primary:hover{background:#c0392b}
.btn-secondary{background:#fff;color:#e74c3c;border:2px solid #e74c3c}
.btn-secondary:hover{background:#fff5f5}
.btn-green{background:#27ae60;color:#fff}
.btn-green:hover{background:#219a52}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:6px}
.btn-outline{background:#fff;color:#666;border:1px solid #ddd}
.btn-outline:hover{border-color:#e74c3c;color:#e74c3c}
.result-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .3s}
.result-overlay.show{opacity:1;pointer-events:auto}
.result-box{background:#fff;border-radius:16px;padding:28px 32px;text-align:center;max-width:340px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.result-box h2{font-size:20px;margin-bottom:10px}
.result-box .icon{font-size:42px;margin-bottom:8px}
.result-box p{color:#666;margin-bottom:16px;font-size:13px;line-height:1.6}
.record-table{width:100%;border-collapse:collapse;font-size:12px}
.record-table th,.record-table td{padding:6px 5px;border-bottom:1px solid #eee;text-align:left}
.record-table th{background:#f8f8f8;color:#666;font-weight:600;position:sticky;top:0}
.record-table tr:hover{background:#fafafa}
.badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600;white-space:nowrap}
.badge-green{background:#d5f5e3;color:#27ae60}
.badge-red{background:#fadbd8;color:#e74c3c}
.badge-gray{background:#eee;color:#999}
.filter-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border:1px solid #ddd;border-radius:16px;background:#fff;font-size:12px;cursor:pointer;transition:all .2s}
.filter-btn:hover{border-color:#e74c3c;color:#e74c3c}
.filter-btn.active{background:#e74c3c;color:#fff;border-color:#e74c3c}
.empty-state{text-align:center;padding:50px 20px;color:#999}
.empty-state .icon{font-size:42px;margin-bottom:12px}
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.summary-card{background:#fff;border-radius:10px;padding:14px 10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.summary-card .num{font-size:24px;font-weight:700;color:#e74c3c}
.summary-card .label{font-size:11px;color:#999;margin-top:2px}
.hint-text{text-align:center;color:#999;font-size:12px;margin-bottom:10px}
.wrong-count{color:#e74c3c;font-weight:700}

@media(max-width:600px){
.header h1{font-size:18px}
.word-card{font-size:14px;padding:10px 12px}
.def-card{font-size:12px;padding:10px 12px}
.container{padding:12px 8px}
}
</style>
</head>

<script>
var DATA = [{"id":1,"type":"成语","words":[{"word":"潜移默化","freq":50,"def":"侧重在性格、习惯、思想等方面无形中受到影响而发生了变化。强调影响是无形、缓慢且不知不觉的，重点在变化的结果。"},{"word":"耳濡目染","freq":15,"def":"侧重在技能方面由于经常听到、看到而受到影响。强调影响是通过感官长期接触而产生的，重点在接触的过程。"},{"word":"耳闻目睹","freq":3,"def":"侧重亲耳听到、亲眼看到。"}]},{"id":2,"type":"成语","words":[{"word":"层出不穷","freq":45,"def":"侧重不同的新事物连续不断出现。"},{"word":"此消彼长","freq":22,"def":"强调一方消退而另一方有所长进。多用于两方面事物的对比。"},{"word":"此起彼伏","freq":17,"def":"这里起来，那里下去。侧重接连不断。"}]},{"id":3,"type":"成语","words":[{"word":"南辕北辙","freq":43,"def":"比喻做一件事时，行动和目的正好相反。"},{"word":"背道而驰","freq":37,"def":"多侧重背离正确的目标，朝相反的方向走。"},{"word":"分道扬镳","freq":11,"def":"侧重由于志趣不同而分开走。"}]},{"id":4,"type":"成语","words":[{"word":"未雨绸缪","freq":42,"def":"强调事先做好准备，适用于事情发生前。"},{"word":"居安思危","freq":12,"def":"侧重在安全环境之下有忧患意识，适用于在好的环境、状态下。"},{"word":"有备无患","freq":7,"def":"侧重做好准备，在灾祸发生时可以从容应对。"}]},{"id":5,"type":"成语","words":[{"word":"一蹴而就","freq":40,"def":"强调一下子就成功，事情完成时间短。"},{"word":"一劳永逸","freq":28,"def":"侧重一次性把问题解决彻底，仅强调次数少，但每次多长时间不确定，并不表示时间短。"},{"word":"立竿见影","freq":25,"def":"在阳光下把竿子竖起来，立刻就看到影子。比喻立刻见到功效。"},{"word":"轻而易举","freq":22,"def":"形容事情容易做，不费力气。"}]},{"id":6,"type":"成语","words":[{"word":"不言而喻","freq":40,"def":"不用说就能明白，侧重道理、事理本身浅显自明，无需额外解释。多用于形容道理、意义等。"},{"word":"显而易见","freq":31,"def":"侧重事物本身明显容易看见，或容易想得明白。既可形容具体事物，也可形容抽象道理。"},{"word":"有目共睹","freq":22,"def":"侧重很多人都看得到，常用来形容大家共同见证的成绩、变化。"}]},{"id":7,"type":"成语","words":[{"word":"不可或缺","freq":40,"def":"不能缺少，非常重要。侧重必要性不可缺失。核心是不能没有。"},{"word":"举足轻重","freq":37,"def":"只要脚移动一下，就会影响两边的轻重。侧重地位重要。"},{"word":"至关重要","freq":33,"def":"强调关系重大，是解决问题的核心关键点。"},{"word":"举重若轻","freq":12,"def":"侧重能力强，能轻松完成繁重困难的工作，形容处理问题的状态。"}]},{"id":8,"type":"成语","words":[{"word":"大相径庭","freq":39,"def":"强调相差很远，大不相同。"},{"word":"相去甚远","freq":15,"def":"侧重差距大，尤其是与某个标准或者好的事物相比时。"},{"word":"截然相反","freq":6,"def":"侧重二者相反。"}]},{"id":9,"type":"成语","words":[{"word":"相辅相成","freq":38,"def":"侧重两者互相配合、缺一不可，强调二者的依赖关系。主体多是事物。"},{"word":"相得益彰","freq":31,"def":"侧重两者互相配合后，各自的优势被进一步放大凸显，更强调结合后的增益效果。"},{"word":"珠联璧合","freq":10,"def":"美好的人或事物本身结合在一起，强调二者搭配的完美性，不突出结合后产生的额外效果。"}]},{"id":10,"type":"成语","words":[{"word":"司空见惯","freq":38,"def":"侧重事情常见，不感到奇怪。"},{"word":"屡见不鲜","freq":24,"def":"侧重指对某种现象见得多就不觉得新奇。"}]},{"id":11,"type":"成语","words":[{"word":"推陈出新","freq":37,"def":"指去掉旧事物的糟粕，取其精华，并让它向新的方向发展，侧重在继承基础上创新，多用于文化、技艺、技术领域的传承创新。"},{"word":"革故鼎新","freq":20,"def":"指破除旧的、建立新的，侧重彻底革除旧秩序旧制度。多用于制度、体制、政治层面的重大变革。"}]},{"id":12,"type":"成语","words":[{"word":"独树一帜","freq":36,"def":"单独树起一面旗帜。侧重自成一家。"},{"word":"标新立异","freq":29,"def":"侧重提出新奇的主张，显示自己与众不同，可做褒义词，也可做贬义词。"},{"word":"别出心裁","freq":11,"def":"侧重想出的办法与众不同。"},{"word":"不拘一格","freq":9,"def":"不局限于一种规格或一个格局。侧重打破常规。"}]},{"id":13,"type":"成语","words":[{"word":"与时俱进","freq":35,"def":"随着时间推移不断向前发展。形容不断进步或提高。"},{"word":"日新月异","freq":32,"def":"每天都在更新，每月都有变化。侧重发展过程中不断出现新事物、新气象。"},{"word":"一日千里","freq":23,"def":"原形容马跑得很快。后侧重进展很快。"}]},{"id":14,"type":"成语","words":[{"word":"迫在眉睫","freq":34,"def":"侧重事情已经逼近眼前，形势十分紧急，强调紧迫性。"},{"word":"当务之急","freq":13,"def":"侧重当前事务中最紧要必须先做的事。"},{"word":"时不我待","freq":8,"def":"侧重时间不等人，强调要抓紧时间把握时机。"},{"word":"迫不及待","freq":6,"def":"侧重主观心情急切到无法等待，不强调客观事情的紧急。"}]},{"id":15,"type":"成语","words":[{"word":"急功近利","freq":32,"def":"贪图眼前的成效和利益，侧重急于求成，想尽快获得利益或成功。"},{"word":"好高骛远","freq":15,"def":"比喻不切实际地追求过高过远的目标，侧重追求目标过高。"},{"word":"好大喜功","freq":7,"def":"侧重想做大事，注重面子工程，作风浮夸。"},{"word":"贪大求全","freq":2,"def":"过分地贪图规模大而全面。"}]},{"id":16,"type":"成语","words":[{"word":"脱颖而出","freq":32,"def":"比喻才能完全显露出来。强调机会触发显露的过程。"},{"word":"与众不同","freq":19,"def":"侧重跟大多数人不一样。"},{"word":"出类拔萃","freq":15,"def":"侧重人的品德才能出众，高出同类之上。"},{"word":"卓尔不群","freq":8,"def":"侧重才德超出寻常、与众不同，强调内在品质的独特性。"}]},{"id":17,"type":"成语","words":[{"word":"人云亦云","freq":31,"def":"人家怎么说，自己也跟着怎么说。指没有主见，只会随声附和。"},{"word":"随波逐流","freq":18,"def":"侧重没有坚定的立场，缺乏判断是非的能力，跟着别人走。"},{"word":"亦步亦趋","freq":18,"def":"别人怎么走就跟着怎么走，比喻处处模仿、事事追随别人。强调处处追随没有主见。"},{"word":"拾人牙慧","freq":8,"def":"侧重没有自己的思想，拾取他人的话。"}]},{"id":18,"type":"成语","words":[{"word":"历久弥新","freq":30,"def":"强调事物经时间沉淀后更鲜活有价值，突出越久越鲜活的生命力。多用于中华文明、老品牌、经典作品等。"},{"word":"薪火相传","freq":17,"def":"侧重文化、技艺等的代际传承。突出代代传承。"}]},{"id":19,"type":"成语","words":[{"word":"理所当然","freq":29,"def":"按道理应当这样。"},{"word":"天经地义","freq":11,"def":"天地间历久不变的常道，指绝对正确，不能改变的道理。语义较重。"}]},{"id":20,"type":"成语","words":[{"word":"一成不变","freq":29,"def":"侧重一点也没有改变，多用于应该改变而没有改变的情形。"},{"word":"亘古不变","freq":14,"def":"侧重于从古至今都没有改变，历时较长。"},{"word":"原封不动","freq":5,"def":"形容保持原样没有变动。"}]},{"id":21,"type":"成语","words":[{"word":"浅尝辄止","freq":29,"def":"略微尝试一下就停下来。侧重于略微尝试就停止，不深入钻研。多用于抽象的学习、研究。"},{"word":"走马观花","freq":28,"def":"骑在奔跑的马上看花。多指观察事物或了解情况不深入细致。"},{"word":"浮光掠影","freq":24,"def":"形容事物一闪而过，使人印象不深。侧重印象不深刻。"},{"word":"蜻蜓点水","freq":14,"def":"侧重做事肤浅不深入，只接触事物表面就离开，不触及实质。"}]},{"id":22,"type":"成语","words":[{"word":"有的放矢","freq":28,"def":"侧重说话做事有针对性、目标性。"},{"word":"一针见血","freq":12,"def":"比喻说话直截了当，切中要害。"},{"word":"对症下药","freq":11,"def":"侧重找准问题，有针对性解决。"},{"word":"量体裁衣","freq":8,"def":"侧重结合个体的实际情况办事。"}]},{"id":23,"type":"成语","words":[{"word":"因地制宜","freq":28,"def":"侧重结合地域的特点选择恰当的办法，核心是适配地域/场景实际条件。"},{"word":"因势利导","freq":23,"def":"侧重顺着事情发展的趋势，向有利目标方向引导，核心是顺应趋势主动引导。"},{"word":"因时制宜","freq":4,"def":"根据不同时期的具体情况，采取适当的措施。核心是根据时间或时期调整。"}]},{"id":24,"type":"成语","words":[{"word":"方兴未艾","freq":27,"def":"事物正在发展，尚未达到止境。侧重新生事物正在蓬勃发展。"},{"word":"悄然兴起","freq":3,"def":"不知不觉中，某样事物开始流行或兴盛起来。侧重不知不觉间开始流行。"}]},{"id":25,"type":"成语","words":[{"word":"应运而生","freq":27,"def":"侧重随着某种形势而产生。"},{"word":"横空出世","freq":12,"def":"形容人或物高大，横在空中，浮出人世，或比喻卓尔不群。"},{"word":"粉墨登场","freq":7,"def":"原指演员化妆上台演戏，现比喻坏人经过一番打扮，登上政治舞台。"}]},{"id":26,"type":"成语","words":[{"word":"融会贯通","freq":27,"def":"侧重把各方面的知识和道理融合，得到全面透彻的理解。"},{"word":"举一反三","freq":20,"def":"强调从一件事情类推而知道其他许多事情。"},{"word":"触类旁通","freq":8,"def":"强调掌握了某一事物的知识或规律，进而推知同类事物的知识或规律。"}]},{"id":27,"type":"成语","words":[{"word":"独一无二","freq":27,"def":"只此一个，别无其他。侧重事物本身与众不同，具有唯一性。"},{"word":"无与伦比","freq":22,"def":"侧重指事物十分完美，使其他事物比不上而造成的独特性。"},{"word":"不可替代","freq":17,"def":"侧重事物十分重要，无法替代。"}]},{"id":28,"type":"成语","words":[{"word":"一脉相承","freq":25,"def":"强调思想、文化、学术等的继承关系。"},{"word":"一以贯之","freq":15,"def":"指用一种思想贯穿始终。也泛指用某种纲领、条例贯穿始终。"},{"word":"一脉相通","freq":7,"def":"指事物之间相互关联，犹如一条脉络贯穿下来可以互通。"}]},{"id":29,"type":"成语","words":[{"word":"根深蒂固","freq":25,"def":"比喻基础深厚，不容易动摇。侧重根基深。"},{"word":"积重难返","freq":12,"def":"多指长期形成的恶习或弊端难以改变。侧重问题难以解决、改变。"},{"word":"坚不可摧","freq":6,"def":"非常坚固，摧毁不了。侧重坚固、坚定。"}]},{"id":30,"type":"成语","words":[{"word":"水到渠成","freq":24,"def":"比喻条件成熟，事情自然会成功。"},{"word":"顺理成章","freq":15,"def":"侧重事情发展合乎情理，自然产生某种结果。"},{"word":"听之任之","freq":4,"def":"侧重任凭事物存在发展而不去过问。"},{"word":"顺其自然","freq":2,"def":"侧重不借助外力，顺着事物本来性质自然发展。"}]},{"id":31,"type":"成语","words":[{"word":"缘木求鱼","freq":24,"def":"强调方法错误，不能达到目的。"},{"word":"竭泽而渔","freq":11,"def":"侧重只顾眼前利益，不顾长远，目光短浅。跟杀鸡取卵意思一致，可通用。"},{"word":"寅吃卯粮","freq":9,"def":"指当前经济困难入不敷出，提前透支了未来的收入/资源，侧重财务/资源的提前透支。"},{"word":"杀鸡取卵","freq":8,"def":"侧重只顾眼前利益，不顾长远，目光短浅。"}]},{"id":32,"type":"成语","words":[{"word":"循规蹈矩","freq":24,"def":"侧重守规矩，强调不敢打破规矩进行变通。重点在规则底线，严格遵守规则，不敢违规越界。"},{"word":"按部就班","freq":23,"def":"侧重按照一定的条理，遵循一定的程序。"}]},{"id":33,"type":"成语","words":[{"word":"息息相关","freq":24,"def":"形容彼此关系非常密切。侧重客观上联系紧密，不强调利害祸福关联。"},{"word":"休戚与共","freq":22,"def":"侧重利害相同，祸福同当。侧重忧喜祸福共同承担。"},{"word":"休戚相关","freq":18,"def":"形容关系密切，利害一致，侧重忧喜祸福互相牵连，只强调利益关联，不要求共同承担。"},{"word":"唇齿相依","freq":10,"def":"比喻双方关系密切，相互依存，多用于国家、地区之间等。"}]},{"id":34,"type":"成语","words":[{"word":"琳琅满目","freq":24,"def":"形容各种美好的东西多，可以形容商品、展品、工艺品等各类好物。"},{"word":"汗牛充栋","freq":14,"def":"藏书非常多，牛运书累得出汗，用来描述书多。"}]},{"id":35,"type":"成语","words":[{"word":"纸上谈兵","freq":23,"def":"侧重空谈理论，脱离实际。"},{"word":"闭门造车","freq":17,"def":"关起门来造车子。比喻脱离实际，只凭主观办事。"}]},{"id":36,"type":"成语","words":[{"word":"顾此失彼","freq":23,"def":"形容忙乱或慌张的情景。侧重由于考虑不全面或心理上慌张导致无法应付，形容不能兼顾。"},{"word":"捉襟见肘","freq":23,"def":"原形容衣服破烂。比喻顾此失彼，穷于应付。侧重因能力不够而无法应对；也可形容衣服破烂、经济困难。"},{"word":"左支右绌","freq":10,"def":"指力量不足，应付了这方面，那方面又出了问题。不用于经济窘困，只用来形容应对问题时力量不足，语体色彩更正式书面。"}]},{"id":37,"type":"成语","words":[{"word":"墨守成规","freq":23,"def":"形容因循守旧，不思变革，强调按老规矩办事，不愿改变方法或制度。"},{"word":"抱残守缺","freq":15,"def":"强调守着陈旧、残缺的东西不肯丢弃，常用于观念、旧物等本来就有缺陷或已过时的事物。"},{"word":"固步自封","freq":11,"def":"比喻因循守旧，安于现状，不求进步。"},{"word":"陈陈相因","freq":2,"def":"沿袭老一套文化、思想、制度，没有创新改变，强调沿袭旧有内容没有改进。"}]},{"id":38,"type":"成语","words":[{"word":"唾手可得","freq":23,"def":"比喻非常容易得到。"},{"word":"信手拈来","freq":22,"def":"多指写文章时能自由纯熟的选用词语或应用典故，用不着怎么思考。"},{"word":"妙手偶得","freq":2,"def":"强调由于偶发灵感而做出的作品。"}]},{"id":39,"type":"成语","words":[{"word":"眼花缭乱","freq":23,"def":"指看着复杂纷繁的东西而感到迷乱；也比喻事物复杂，无法辨清。"},{"word":"扑朔迷离","freq":20,"def":"侧重事物本身错综复杂，不容易使人看清真相。"},{"word":"目不暇接","freq":15,"def":"形容眼前东西太多或景物变化太快，来不及看。"}]},{"id":40,"type":"成语","words":[{"word":"如出一辙","freq":22,"def":"侧重两种事物非常相似。"},{"word":"毫无二致","freq":6,"def":"丝毫没有什么两样。指完全一样。"}]},{"id":41,"type":"成语","words":[{"word":"栩栩如生","freq":22,"def":"指艺术形象非常逼真，如同活的一样。侧重像活的一样。可用于形容事物，多指静态的东西。"},{"word":"惟妙惟肖","freq":19,"def":"形容描写、模仿得非常逼真、生动。侧重相像、生动。多用于模仿。"},{"word":"跃然纸上","freq":5,"def":"侧重跃然纸上的生动感。"}]},{"id":42,"type":"成语","words":[{"word":"适得其反","freq":22,"def":"侧重于结果与预期正好相反。"},{"word":"事与愿违","freq":16,"def":"侧重于愿望、预期没实现，不一定正好相反。"}]},{"id":43,"type":"成语","words":[{"word":"源源不断","freq":22,"def":"侧重事物连续出现不间断。既可用于具体事物、又可用于抽象事物。"},{"word":"络绎不绝","freq":10,"def":"侧重的是来来往往不断。多用于车马、船只、行人等可移动的事物。"}]},{"id":44,"type":"成语","words":[{"word":"津津乐道","freq":22,"def":"侧重对某件事兴趣浓厚，不停地谈论。"},{"word":"脍炙人口","freq":19,"def":"比喻好的诗文或事物受到人们的称赞和传诵。可以直接说脍炙人口的作品。"},{"word":"喜闻乐见","freq":18,"def":"喜欢听，乐意看，指很受欢迎。一般说群众喜闻乐见的XX。"}]},{"id":45,"type":"成语","words":[{"word":"生生不息","freq":21,"def":"侧重生命事物不断繁衍新生，没有停止。"},{"word":"周而复始","freq":11,"def":"侧重按照固定周期循环往复，强调一轮又一轮的重复循环。"},{"word":"绵延不绝","freq":8,"def":"侧重空间上连续不断，多形容山脉河流道路等具体事物延伸，也可形容文化传承。"}]},{"id":46,"type":"成语","words":[{"word":"相提并论","freq":21,"def":"侧重把有高下之分且无法一起比较、看待的人或事情一起来比较。"},{"word":"等量齐观","freq":18,"def":"侧重把不同的事物按照同一标准来看待。"},{"word":"同日而语","freq":15,"def":"侧重把不同时间的事情放在同一时间来谈论。"},{"word":"混为一谈","freq":11,"def":"侧重把不同的事物说成是同样的事物，多指不分好坏，不分是非。"}]},{"id":47,"type":"成语","words":[{"word":"实事求是","freq":21,"def":"从客观实际出发，探求事物的本质规律，按照实际情况办事。侧重从实际出发。"},{"word":"脚踏实地","freq":16,"def":"侧重做事情踏实、认真。"},{"word":"稳扎稳打","freq":8,"def":"原指作战时步步扎营、稳妥推进，现多指做事稳当、有步骤、有把握地推进。"}]},{"id":48,"type":"成语","words":[{"word":"习以为常","freq":20,"def":"形容对常见事物已经习惯，不觉得反常。"},{"word":"老生常谈","freq":10,"def":"比喻人们听惯了、没新意的言论，但内容不一定无意义。"},{"word":"陈词滥调","freq":5,"def":"指陈腐空泛、不切实际的论调，内容没有实用性。"}]},{"id":49,"type":"成语","words":[{"word":"凤毛麟角","freq":20,"def":"比喻珍贵而稀少的人或事物。既可以形容人，也可以形容具体的物。"},{"word":"吉光片羽","freq":4,"def":"比喻残存下来的珍贵文物/文献遗存。只能用于具体的物，特指古代遗存下来的珍贵事物。"}]},{"id":50,"type":"成语","words":[{"word":"一目了然","freq":20,"def":"一眼就能看得清楚明白，侧重强调对事物本质、原委理解得清晰透彻。"},{"word":"一览无余","freq":8,"def":"形容事物简单，一下子全可以看清。侧重强调视野开阔无遮挡。"},{"word":"一览而尽","freq":1,"def":"一眼望去，事物就全部收入眼底，单纯强调视野范围内所有事物都能看完。"}]},{"id":51,"type":"成语","words":[{"word":"力不从心","freq":20,"def":"侧重心里想做，但能力有限。"},{"word":"无能为力","freq":6,"def":"侧重没有办法。"}]},{"id":52,"type":"成语","words":[{"word":"叹为观止","freq":20,"def":"强调赞美所见到的事物好到了极点。"},{"word":"林林总总","freq":13,"def":"强调形容种类繁多，数量众多。"},{"word":"洋洋洒洒","freq":5,"def":"形容文章或谈话篇幅长、内容充实，有时也形容规模、气势盛大。"}]},{"id":53,"type":"成语","words":[{"word":"视而不见","freq":19,"def":"指看见了当作没看见。"},{"word":"听而不闻","freq":3,"def":"听见了故意装作没听到，不放在心上。"}]},{"id":54,"type":"成语","words":[{"word":"天马行空","freq":19,"def":"多比喻诗文、想象气势豪放不受拘束，偶尔用于形容人浮躁不踏实。最普遍用法是形容思想/表达不受拘束。"},{"word":"坐而论道","freq":8,"def":"原指坐着空谈大道理，只会口头说说却不付诸实际行动，含贬义。强调言论不落地，缺乏实际行动。"}]},{"id":55,"type":"成语","words":[{"word":"齐头并进","freq":18,"def":"多形容几件事情或几项工作同时进行。"},{"word":"并行不悖","freq":17,"def":"侧重同时进行，不相冲突。"},{"word":"并驾齐驱","freq":13,"def":"比喻齐头并进，不分前后。也比喻地位或程度相等，不分高下。侧重不相上下。"},{"word":"双管齐下","freq":12,"def":"侧重同时进行或同时使用，一般适用于两件事物或两个方面。"}]},{"id":56,"type":"成语","words":[{"word":"振聋发聩","freq":18,"def":"比喻言论、文章有使人醒悟、启发愚蒙的作用。侧重用语言文字唤醒糊涂麻木的人。强调唤醒、警醒的作用。"},{"word":"掷地有声","freq":10,"def":"原形容歌声或言辞优美，后比喻文章、言论等有力且有分量。侧重内容的分量、力度。"},{"word":"惊世骇俗","freq":3,"def":"因言行异于寻常而使人震惊。"}]},{"id":57,"type":"成语","words":[{"word":"如火如荼","freq":18,"def":"现用来形容气势旺盛，气氛热烈。"},{"word":"风起云涌","freq":18,"def":"形容事物迅速发展，层出不穷，声势浩大。常和浪潮、变革搭配。"},{"word":"铺天盖地","freq":16,"def":"侧重来势猛、覆盖面大，到处都是。"}]},{"id":58,"type":"成语","words":[{"word":"难以为继","freq":18,"def":"强调事情很难继续进行。通常与发展模式、发展方式等进行搭配。"},{"word":"后继无人","freq":7,"def":"强调事业没有人继承，通常与某种传统手艺、艺术传承进行搭配。"}]},{"id":59,"type":"成语","words":[{"word":"比比皆是","freq":18,"def":"侧重于到处都是，十分常见。"},{"word":"不可胜数","freq":8,"def":"侧重于人或事物的数量很多，数不完。"},{"word":"不一而足","freq":4,"def":"侧重同类事物很多，无法列举齐全。"}]},{"id":60,"type":"成语","words":[{"word":"舍本逐末","freq":18,"def":"侧重舍弃根本的、主要的，而追求不重要的细枝末节。核心是做法错，放弃根本，只抓细枝末节。"},{"word":"本末倒置","freq":16,"def":"比喻把主要事物和次要事物弄颠倒。核心是位置错，只是把主次关系弄颠倒，不一定主动抛弃根本。"},{"word":"喧宾夺主","freq":9,"def":"比喻次要的事物侵占了原有的、主要的事物的地位。"},{"word":"哗众取宠","freq":9,"def":"用浮夸言行讨好众人，博取关注。和主次错位无关，是骗关注的行为。"}]},{"id":61,"type":"成语","words":[{"word":"不谋而合","freq":17,"def":"侧重没有商量，意见或行动却完全一致。多指见解、意见、计划等的相同。"},{"word":"不约而同","freq":8,"def":"事先没有约定而相互一致。多指行动的一致性。"},{"word":"一拍即合","freq":3,"def":"比喻双方很快、很容易一致。多形容想法、观念等的相同。"}]},{"id":62,"type":"成语","words":[{"word":"变幻莫测","freq":17,"def":"形容变化很多，不能预料。"},{"word":"瞬息万变","freq":9,"def":"形容在极短的时间内变化迅速。"}]},{"id":63,"type":"成语","words":[{"word":"削足适履","freq":17,"def":"侧重不合理地迁就。"},{"word":"生搬硬套","freq":10,"def":"侧重不顾实际情况，机械地运用别人的经验，照抄别人的办法。"},{"word":"委曲求全","freq":5,"def":"指为了顾全大局而让步。侧重为了保全而无奈迁就。"},{"word":"求全责备","freq":4,"def":"指对人对事要求完美无缺。"}]},{"id":64,"type":"成语","words":[{"word":"置若罔闻","freq":17,"def":"把信息放在一边，就好像没听见一样，侧重行为层面的刻意忽视。"},{"word":"充耳不闻","freq":9,"def":"塞住耳朵不听，形容有意拒绝听取别人的意见，侧重主观态度的故意排斥。"},{"word":"不闻不问","freq":3,"def":"侧重不关心、不过问。"}]},{"id":65,"type":"成语","words":[{"word":"因噎废食","freq":17,"def":"比喻因怕出问题或出过一点问题，就干脆彻底不做某事，是一种极端的行为。"},{"word":"投鼠忌器","freq":3,"def":"想打老鼠，又怕打坏旁边的器物，比喻做事有所顾忌，不敢彻底放手去做。"}]},{"id":66,"type":"成语","words":[{"word":"置身事外","freq":17,"def":"指把自己放在事情之外，毫不关心。表示对事情不参与、不关心。"},{"word":"袖手旁观","freq":12,"def":"比喻看着别人有难，不去帮忙。强调见人危难不帮忙。"},{"word":"作壁上观","freq":6,"def":"比喻坐观成败，不帮助任何一方，多用于双方冲突、争斗的场景。"},{"word":"置之度外","freq":2,"def":"指不把个人的生死利害等放在心上。"}]},{"id":67,"type":"成语","words":[{"word":"独善其身","freq":17,"def":"原指修身养性，现指只顾自己，不管他人/集体。"},{"word":"明哲保身","freq":8,"def":"指智慧的人，善于趋安避危，保全自身。强调因怕连累自己，回避斗争保全自己。"},{"word":"洁身自好","freq":3,"def":"多指保持自身的清白，自爱自尊，不与他人同流合污。强调能守住自身底线。"}]},{"id":68,"type":"成语","words":[{"word":"良莠不齐","freq":17,"def":"好人坏人都有，混杂在一起（传统的规范用法）。"},{"word":"鱼龙混杂","freq":16,"def":"指的是坏人和好人混在一起（传统的规范用法）。"},{"word":"滥竽充数","freq":8,"def":"不会吹竽的人混在吹竽的队伍里充数。比喻无本领的冒充有本领，次货冒充好货。"}]},{"id":69,"type":"成语","words":[{"word":"束手无策","freq":16,"def":"形容遇到问题时毫无解决的办法。"},{"word":"无所适从","freq":13,"def":"不知听从哪一个好。指不知怎么办才好。"},{"word":"不知所措","freq":7,"def":"不知道怎么办才好。形容受窘或发急。"},{"word":"手足无措","freq":6,"def":"手脚不知放到哪儿好。形容举动慌张，或无法应付。"}]},{"id":70,"type":"成语","words":[{"word":"相映成趣","freq":16,"def":"相互衬托，显得有趣味、有情趣。强调两者搭配后产生趣味性、生动感。"},{"word":"如影随形","freq":16,"def":"像影子跟着身体一样，比喻关系密切，不可分离。多用于人与人、事物与事物之间的紧密联系。"},{"word":"交相辉映","freq":15,"def":"各种光亮、色彩等相互映照，显得格外美丽辉煌。强调相互映衬，产生灿烂、壮观的视觉效果。"}]},{"id":71,"type":"成语","words":[{"word":"纷至沓来","freq":16,"def":"纷纷到来；连续不断地到来。"},{"word":"接踵而至","freq":15,"def":"指人们前脚跟着后脚，接连不断地来。形容来者很多，络绎不绝。"},{"word":"俯拾皆是","freq":7,"def":"只要低下头来捡取，到处都是，形容多而易得。"}]},{"id":72,"type":"成语","words":[{"word":"取长补短","freq":15,"def":"吸取别人的长处，来弥补自己的不足之处。侧重补，强调借他人长处补自己短处。"},{"word":"扬长避短","freq":11,"def":"强调发挥自己的长处，避开短处。核心是个体对自身优劣势的主动选择。"},{"word":"互通有无","freq":5,"def":"拿出自己多余的东西给对方，与之进行交换，以得到自己所缺少的东西。核心是双向交换实现资源互补。"}]},{"id":73,"type":"成语","words":[{"word":"大行其道","freq":15,"def":"指某种事物、思潮、风气在某一范围内广为流传、盛行一时；一般为中性偏贬义。"},{"word":"异军突起","freq":8,"def":"一支新的力量突然兴起、独树一帜，侧重描述新生力量突然出现。"}]},{"id":74,"type":"成语","words":[{"word":"筚路蓝缕","freq":15,"def":"驾着简陋柴车、穿着破烂衣服开辟土地，强调创业开拓的艰苦。常用于形容企业初创、事业开创。"},{"word":"栉风沐雨","freq":4,"def":"以风梳头、以雨洗发，强调外奔波劳碌的辛苦。常用于形容户外工作者、建设者。"}]},{"id":75,"type":"成语","words":[{"word":"莫衷一是","freq":15,"def":"意见分歧，难有一致的定论。"},{"word":"众说纷纭","freq":8,"def":"侧重人多嘴杂，议论纷纷。"},{"word":"见仁见智","freq":9,"def":"侧重针对同一问题，不同人从不同的立场或角度有不同的看法。"},{"word":"各持己见","freq":3,"def":"侧重各人都坚持自己的意见。"}]},{"id":76,"type":"成语","words":[{"word":"望尘莫及","freq":15,"def":"侧重赶不上。"},{"word":"鞭长莫及","freq":13,"def":"比喻距离太远/权力不够，力量达不到。侧重力量够不到、管不上。"},{"word":"望其项背","freq":10,"def":"强调赶得上，该词多用于否定句，常见用法难以望其项背。"}]},{"id":77,"type":"成语","words":[{"word":"避重就轻","freq":15,"def":"侧重避开重要的、严重的，选择轻微的。"},{"word":"避实就虚","freq":3,"def":"指避开真实的情况或对手的强项，去攻击或关注不实在的部分，常带有主动选择的策略性。"}]},{"id":78,"type":"成语","words":[{"word":"如履薄冰","freq":15,"def":"侧重思想、行动都比较谨慎，有忧患感，常和如临深渊连用。"},{"word":"谨言慎行","freq":4,"def":"侧重言语和行动都非常谨慎克制，一般是出于自我约束，怕说错话做错事。"},{"word":"小心翼翼","freq":2,"def":"侧重言行举止非常小心，一点不敢疏忽，强调动作层面的小心。"}]},{"id":79,"type":"成语","words":[{"word":"一挥而就","freq":15,"def":"形容文章、写字、绘画很快就完成；强调快，突出完成迅速。适用于写作、画画等。"},{"word":"一气呵成","freq":8,"def":"一口气做成。强调连贯，突出过程不中断。适用于写作或做事情。"}]},{"id":80,"type":"成语","words":[{"word":"水涨船高","freq":15,"def":"比喻事物随着它所凭借的基础的提高而增长提高。侧重随依托条件的提高而提高。"},{"word":"与日俱增","freq":13,"def":"侧重随时间推移而不断增长。"},{"word":"居高不下","freq":3,"def":"侧重一直处于高位。"}]},{"id":81,"type":"成语","words":[{"word":"空中楼阁","freq":15,"def":"建在半空中的楼阁，比喻脱离实际的空想计划/理论。侧重脱离实际。"},{"word":"水中捞月","freq":6,"def":"到水里捞月亮，比喻白费力气，没有结果。侧重行动徒劳，无结果。"},{"word":"镜花水月","freq":3,"def":"镜中花、水中月，比喻虚幻缥缈、捉摸不到的事物。指虚幻不可得的事物。"}]},{"id":82,"type":"成语","words":[{"word":"趋之若鹜","freq":15,"def":"比喻很多人争相追逐不正当、不好的事物，贬义词。"},{"word":"万人空巷","freq":7,"def":"指家家户户的人都从街巷里出来，涌向特定活动场所，多用来形容庆祝、欢迎等积极盛大的轰动场面，褒义词。"}]},{"id":83,"type":"成语","words":[{"word":"包罗万象","freq":15,"def":"侧重本身包含的内容种类繁多、应有尽有，强调涵盖全。"},{"word":"应有尽有","freq":6,"def":"侧重品类齐全，该有的都有，强调具体的内容完备。"}]},{"id":84,"type":"成语","words":[{"word":"美轮美奂","freq":15,"def":"原本形容房屋建筑高大华美、富丽堂皇，延伸可用于建筑相关的装饰布置。传统规范用法仅适用于建筑及建筑装饰。"},{"word":"精妙绝伦","freq":6,"def":"极其精致巧妙，独一无二，常用于形容艺术品、技艺、设计等达到了极高的水准。"}]},{"id":85,"type":"成语","words":[{"word":"浩如烟海","freq":14,"def":"形容事物数量繁多或极其丰富。多用于书籍、文献、资料等。"},{"word":"蔚为大观","freq":4,"def":"形容美好事物汇聚后形成的盛大壮观景象，多指文物、展品、自然景观等。"}]},{"id":86,"type":"成语","words":[{"word":"如日中天","freq":14,"def":"好像太阳正在天顶。比喻事物正发展到十分兴盛的阶段。"},{"word":"风生水起","freq":4,"def":"比喻事情做得特别好，发展得快。侧重事情做得好，发展得快。"}]},{"id":87,"type":"成语","words":[{"word":"进退维谷","freq":14,"def":"侧重进退两难，进也不是，退也不是。"},{"word":"骑虎难下","freq":3,"def":"侧重于主观上想停，受到客观条件的限制却停不下来。"},{"word":"进退失据","freq":2,"def":"失据：失去凭依。侧重失去凭依，没有根据，导致进退两难。"}]},{"id":88,"type":"成语","words":[{"word":"引人入胜","freq":14,"def":"侧重吸引人，现多用来指风景或文艺作品特别吸引人。"},{"word":"妙趣横生","freq":8,"def":"美妙的意趣层出不穷地流露，多用来评价语言、文章、美术作品等内容充满趣味，属于褒义词。"},{"word":"有声有色","freq":4,"def":"侧重说话、表演或活动的表现生动精彩，核心强调呈现效果。"}]},{"id":89,"type":"成语","words":[{"word":"泥沙俱下","freq":14,"def":"泥土和沙子跟着江水一起冲下来，比喻好的坏的混杂在一起。"},{"word":"江河日下","freq":7,"def":"江水一天天向下游流去，比喻情况一天天坏下去，越来越糟糕。"},{"word":"日薄西山","freq":5,"def":"太阳快要落到西山下，比喻人衰老、事物接近腐朽死亡，快要灭亡。程度比江河日下更重。"}]},{"id":90,"type":"成语","words":[{"word":"脱胎换骨","freq":14,"def":"比喻通过教育，思想得到彻底改造。侧重彻底改变。"},{"word":"焕然一新","freq":11,"def":"侧重变得崭新、鲜亮。"},{"word":"改头换面","freq":9,"def":"侧重只改外表和形式，内容实质不变。"}]},{"id":91,"type":"成语","words":[{"word":"断章取义","freq":14,"def":"不顾全文整体，只截取个别词句来曲解原意。强调故意扭曲原本含义，理解错误。"},{"word":"以偏概全","freq":11,"def":"用局部的情况概括整体，得出错误的结论。强调片面地看待整体问题。"}]},{"id":92,"type":"成语","words":[{"word":"淋漓尽致","freq":14,"def":"重点在尽致，指把意思、道理或事物揭露得非常充分、透彻，强调对事物的刻画、分析毫无遗漏。"},{"word":"酣畅淋漓","freq":6,"def":"重点在酣畅，意思是情感抒发得特别饱满、畅快，强调主观上的痛快尽兴。"}]},{"id":93,"type":"成语","words":[{"word":"锦上添花","freq":14,"def":"比喻好上加好，美上添美。侧重好上加好。"},{"word":"雪中送炭","freq":4,"def":"比喻在别人急需时给以物质上或精神上的帮助。侧重救人于危难之中。"}]},{"id":94,"type":"成语","words":[{"word":"微不足道","freq":14,"def":"侧重小得不值得一提。"},{"word":"无足轻重","freq":12,"def":"侧重不重要。"},{"word":"螳臂当车","freq":1,"def":"比喻做力量做不到的事情，必然失败。"},{"word":"杯水车薪","freq":1,"def":"比喻力量太小，解决不了问题。"}]},{"id":95,"type":"成语","words":[{"word":"鳞次栉比","freq":14,"def":"像鱼鳞、梳篦的齿一样有序排列，专门形容房屋、船只等具体事物排列得密集又整齐。"},{"word":"星罗棋布","freq":9,"def":"象天空的星星和棋盘上的棋子那样分布着。形容数量很多，分布很广。"}]},{"id":96,"type":"成语","words":[{"word":"见微知著","freq":13,"def":"侧重指能从微小细节看出事物本质/发展趋势。突出由小见大、以细节推整体趋势的推理能力。"},{"word":"明察秋毫","freq":12,"def":"强调目光敏锐，对细节/细微之处看得精准。多用于形容人目光敏锐，能发现隐藏的细节。"},{"word":"洞若观火","freq":11,"def":"形容对事物的整体、本质看得透彻清晰，如同看火一样分明。多用于分析宏观局势、整体问题。"}]},{"id":97,"type":"成语","words":[{"word":"锲而不舍","freq":13,"def":"强调在具体行动中持续付出、不轻易放弃，有恒心、有毅力。"},{"word":"矢志不渝","freq":12,"def":"侧重立下的志向、信念不会改变，适用场景更偏向理想、信仰等庄重的长期目标。"},{"word":"坚韧不拔","freq":7,"def":"强调意志坚定，不可动摇。侧重意志层面的坚定顽强。"}]},{"id":98,"type":"成语","words":[{"word":"曲高和寡","freq":13,"def":"曲调高深，能跟着唱的人就少。侧重言论或作品高深，能理解的人少。"},{"word":"阳春白雪","freq":13,"def":"泛指高深的、不通俗的文学艺术。"},{"word":"孤芳自赏","freq":10,"def":"把自己当成一朵花自我欣赏，比喻自命清高、自我欣赏。"}]},{"id":99,"type":"成语","words":[{"word":"集思广益","freq":13,"def":"集中众人的智慧，广泛吸收有益意见，侧重收集意见，获取好思路。"},{"word":"博采众长","freq":13,"def":"广泛吸取各家的长处优点，侧重吸取长处，提升自身水平。"},{"word":"群策群力","freq":6,"def":"群众一起出主意、出力量，侧重共同出力，一起解决问题。"}]},{"id":100,"type":"成语","words":[{"word":"不以为然","freq":13,"def":"不认为是对的，侧重不同意、不认可。"},{"word":"不以为意","freq":3,"def":"不把它放在心上。表示对人或事抱轻视态度。侧重不在意，不放在心上。"}]},{"id":101,"type":"成语","words":[{"word":"殚精竭虑","freq":13,"def":"侧重用尽心思。"},{"word":"呕心沥血","freq":9,"def":"比喻费尽心血，多形容长期为事业、工作、文艺创作等无私付出。"},{"word":"废寝忘食","freq":7,"def":"侧重专注于某事，多描述高度专注的状态。"},{"word":"苦心孤诣","freq":5,"def":"指尽心钻研，达到旁人难以企及的境界，也指为解决问题费尽心思。"}]},{"id":102,"type":"成语","words":[{"word":"独辟蹊径","freq":13,"def":"自己开辟一条路，比喻独创一种新风格或新方法。多用于做事的方法、思路、创作风格。"},{"word":"别具匠心","freq":6,"def":"匠心：巧妙的心思。指具有独到的想法或创造性。"}]},{"id":103,"type":"成语","words":[{"word":"特立独行","freq":13,"def":"形容人的志行高洁，不同流俗。强调人格独立。多用于人的性格、品行、行事风格。"},{"word":"别开生面","freq":5,"def":"比喻另外创出一种新的形式或局面。强调开创新的形式、局面。"}]},{"id":104,"type":"成语","words":[{"word":"各行其是","freq":13,"def":"按照各自认为对的去做，各搞一套；强调思想不统一、行动不一致，含贬义。"},{"word":"各自为政","freq":8,"def":"比喻不考虑全局，各自按照自己的主张办事，不互相配合。"},{"word":"各司其职","freq":4,"def":"各自负责做自己该做的事，侧重做好自己的事。"},{"word":"各得其所","freq":4,"def":"指各自得到所需要的东西；也指每个人或事物都得到适当的安置。侧重得到适当的安排。"}]},{"id":105,"type":"成语","words":[{"word":"屈指可数","freq":13,"def":"侧重数量稀少，掰着手指头就能数清楚。"},{"word":"首屈一指","freq":4,"def":"侧重排名第一，指最优秀最强的。"}]},{"id":106,"type":"成语","words":[{"word":"风靡一时","freq":13,"def":"形容事物在某段时间里特别火、流行，强调短暂性，是中性词。"},{"word":"蔚然成风","freq":12,"def":"形容一种事物逐渐发展、盛行，形成风气（多指好的）。"}]},{"id":107,"type":"成语","words":[{"word":"异曲同工","freq":13,"def":"不同的曲子，演奏得同样精妙，侧重方法或方式不同，效果同样精妙出色。"},{"word":"殊途同归","freq":11,"def":"通过不同的道路，走到同一个终点，比喻不同方法得到相同结果，只强调最终结果/目标相同。"}]},{"id":108,"type":"成语","words":[{"word":"望洋兴叹","freq":12,"def":"原指面对伟大事物感叹自身渺小，现核心语义是客观条件不满足，做不成只能无奈叹气。"},{"word":"望而却步","freq":11,"def":"侧重看到困难或危险而在行动上的退缩。多形容面对强大的敌人和困难时害怕。"},{"word":"望而生畏","freq":10,"def":"看见了就害怕。侧重心理上的畏惧。"},{"word":"畏葸不前","freq":2,"def":"侧重因为畏惧而不敢前进。"}]},{"id":109,"type":"成语","words":[{"word":"润物无声","freq":13,"def":"指有大胸怀者，做了贡献而不张扬，默默奉献。"},{"word":"春风化雨","freq":10,"def":"比喻良好的熏陶和教育。"}]},{"id":110,"type":"成语","words":[{"word":"刻舟求剑","freq":13,"def":"比喻做事固执，不知道根据实际情况变化改变思路。"},{"word":"买椟还珠","freq":7,"def":"买下木匣，退还了珍珠。比喻没有眼力，取舍不当。强调分不清价值高低。"}]},{"id":111,"type":"成语","words":[{"word":"千头万绪","freq":13,"def":"侧重事情头绪多，复杂纷乱，理不清脉络，强调多且杂，难梳理。"},{"word":"纷繁芜杂","freq":5,"def":"侧重事物多且杂乱，没有条理，内容混乱繁杂。多用于观点、言论、信息等抽象内容。"}]},{"id":112,"type":"成语","words":[{"word":"兼收并蓄","freq":12,"def":"侧重把不同性质、不同来源的内容都吸收保存下来，强调主动吸收融合。多用于文化、思想、学术领域。"},{"word":"海纳百川","freq":6,"def":"侧重心胸开阔，能包容吸纳不同事物，强调容量大、能包容。"}]},{"id":113,"type":"成语","words":[{"word":"举步维艰","freq":12,"def":"抬脚行走都十分困难，形容已经陷入十分艰难的处境，但仍具备一定的行动空间。"},{"word":"寸步难行","freq":7,"def":"比喻处境极其艰难，完全没办法开展活动推进工作，语义程度比举步维艰更重。"}]},{"id":114,"type":"成语","words":[{"word":"相形见绌","freq":12,"def":"侧重与同类事物相比，显出不足，强调客观上比不上。"},{"word":"自惭形秽","freq":5,"def":"泛指自愧不如别人。强调主观上的想法。"},{"word":"自愧弗如","freq":2,"def":"自感不如别人而内心惭愧。强调主观上的想法。"}]},{"id":115,"type":"成语","words":[{"word":"夸夸其谈","freq":12,"def":"形容说话或写文章浮夸不切实际。贬义，强调只说空话没有实际内容。"},{"word":"侃侃而谈","freq":4,"def":"形容理直气壮或从容不迫地谈话。褒义，指说话有理有据从容不迫。"}]},{"id":116,"type":"成语","words":[{"word":"高屋建瓴","freq":12,"def":"从高屋脊往下倒水，比喻对问题认识全面深刻，观点有高度。侧重形容见解、论述、分析的高度和深度。"},{"word":"高瞻远瞩","freq":9,"def":"站得高看得远，比喻眼光远大，有长远远见。侧重形容战略、眼光、规划的前瞻性。"},{"word":"居高临下","freq":4,"def":"站在高处俯视下方，比喻占据高位控制他人，或姿态傲慢。"}]},{"id":117,"type":"成语","words":[{"word":"孜孜以求","freq":12,"def":"比喻不知疲倦地探求，强调不懈追求目标。"},{"word":"梦寐以求","freq":4,"def":"形容迫切地希望着，强调极度渴望得到。"},{"word":"夙兴夜寐","freq":2,"def":"早起晚睡，形容做事勤奋辛劳，不强调追求目标。"}]},{"id":118,"type":"成语","words":[{"word":"水乳交融","freq":12,"def":"比喻不同事物完全融合，关系极其紧密。侧重两者相互融合。"},{"word":"相伴相生","freq":3,"def":"指一种事物与另一种事物相互伴生，形容彼此之间的依赖关系，侧重两者互相依存。"}]},{"id":119,"type":"成语","words":[{"word":"无懈可击","freq":12,"def":"没有一点弱点可以让人攻击。侧重十分严密，没有漏洞。"},{"word":"尽善尽美","freq":9,"def":"极其完善，极其美好。侧重完美、没有缺点。"},{"word":"万无一失","freq":6,"def":"指非常有把握，绝对不会出差错。侧重没有差错。"}]},{"id":120,"type":"成语","words":[{"word":"轻描淡写","freq":12,"def":"强调着力不多地描写或叙述或谈问题时把重要问题轻轻带过。"},{"word":"语焉不详","freq":6,"def":"指虽然提到了，但说得不详细，不清楚。"}]},{"id":121,"type":"成语","words":[{"word":"矫枉过正","freq":12,"def":"比喻纠正谬误超过了应有的限度。强调纠正偏差时分寸过头，反而出新问题。"},{"word":"过犹不及","freq":8,"def":"事情办得过火，就跟做得不够一样，都是不好的。强调做事超出合适限度。"},{"word":"物极必反","freq":6,"def":"事物发展到极点，就会向相反方向转化。"},{"word":"文过饰非","freq":3,"def":"掩饰过失、错误。"}]},{"id":122,"type":"成语","words":[{"word":"微乎其微","freq":12,"def":"侧重数量、程度非常少，非常小，强调数值/分量极小。"},{"word":"无关紧要","freq":6,"def":"侧重不重要，不影响大局，强调地位/意义上不重要。"}]},{"id":123,"type":"成语","words":[{"word":"沧海桑田","freq":12,"def":"比喻世事变化很大，侧重于时间跨度长、事物变迁的彻底性。"},{"word":"翻天覆地","freq":6,"def":"强调事物从根儿上发生了颠覆性的改变，常用来描述社会、时代等层面的巨变。"},{"word":"云谲波诡","freq":2,"def":"形容事物或局势变幻莫测、错综复杂，带有捉摸不透、难以预料的意味。"}]},{"id":124,"type":"成语","words":[{"word":"曲突徙薪","freq":11,"def":"比喻事先采取措施，才能防止灾祸。核心是主动预防、防患于未然。"},{"word":"夕惕若厉","freq":4,"def":"指从早到晚，时刻警惕，好像面临危难一样，强调始终保持高度的警觉和戒备状态。"}]},{"id":125,"type":"成语","words":[{"word":"饮鸩止渴","freq":11,"def":"喝毒酒解渴。侧重解决问题的方法错误，招致更大的麻烦。强调只求当下应急，不顾未来严重后患。"},{"word":"抱薪救火","freq":6,"def":"抱着柴火去救火，比喻用错误的方法消除灾祸，反而让灾祸扩大。强调方法错误直接导致问题更严重。"}]},{"id":126,"type":"成语","words":[{"word":"嗤之以鼻","freq":11,"def":"用鼻子哼声冷笑。表示轻蔑。侧重用神态表达轻蔑，嘲讽、看不起。"},{"word":"不屑一顾","freq":11,"def":"侧重根本不值得放在心上，不值得一看，强调不重视。"},{"word":"不足挂齿","freq":5,"def":"侧重事物本身微不足道，不值得一提，多用来谦辞或客观评价。"}]},{"id":127,"type":"成语","words":[{"word":"平分秋色","freq":11,"def":"强调结果各占一半，难分高低，偏静态结果描述。"},{"word":"分庭抗礼","freq":11,"def":"强调双方地位平等，可互相抗衡。"},{"word":"势均力敌","freq":4,"def":"强调双方力量均衡，不分上下。"}]},{"id":128,"type":"成语","words":[{"word":"画地为牢","freq":11,"def":"在地上画一个圈当做监狱。多比喻主动或被动地将自己限制在固定范围内，不敢突破。"},{"word":"作茧自缚","freq":10,"def":"比喻做了某件事，结果使自己受困。侧重自己使自己陷入困境。"},{"word":"咎由自取","freq":2,"def":"指灾祸、惩罚或坏结果完全是自己的过错招来的。侧重使自己遭受灾祸、受到惩罚。"}]},{"id":129,"type":"成语","words":[{"word":"设身处地","freq":11,"def":"设想自己处在别人的处境中，替他人着想，侧重主动换位思考的动作本身。"},{"word":"感同身受","freq":10,"def":"现多指虽未亲身经历，却能像自己亲身经历一样体会到对方的感受。"},{"word":"将心比心","freq":5,"def":"拿自己的心去比照别人的心，指遇事设身处地替别人着想。强调以己心度人，能够共情。"},{"word":"推己及人","freq":4,"def":"用自己的心意去推想别人的心意，设身处地替别人着想。强调从自身出发体谅他人。"}]},{"id":130,"type":"成语","words":[{"word":"滴水不漏","freq":6,"def":"侧重说话做事周密严谨，无破绽。"},{"word":"不折不扣","freq":5,"def":"表示完全十足，不打折扣。常与政策落实、贯彻执行相搭配。"},{"word":"分毫不差","freq":3,"def":"侧重数值、细节完全吻合，没有偏差，强调精准、精确。"}]},{"id":131,"type":"成语","words":[{"word":"众望所归","freq":6,"def":"多用来形容某人得到大家的信赖，被寄予厚望。"},{"word":"实至名归","freq":4,"def":"强调有了实际的学识、技能或成绩，自然就会产生名声。"}]},{"id":132,"type":"成语","words":[{"word":"不落窠臼","freq":6,"def":"比喻有独创风格，不落旧套。强调突破旧套路、老框架，敢于创新。"},{"word":"独具一格","freq":4,"def":"独有一种特别的风格、格调。强调风格本身独特。"}]},{"id":133,"type":"成语","words":[{"word":"移花接木","freq":6,"def":"把花木的枝条嫁接到另一花木上，比喻暗中更换人或事物，常指拼凑、嫁接。"},{"word":"混淆是非","freq":5,"def":"侧重颠倒正误。"},{"word":"偷梁换柱","freq":4,"def":"比喻用欺骗的手法暗中改变事物的内容或事情的性质。"},{"word":"牵强附会","freq":2,"def":"侧重勉强建立联系，把不相关的事物扯在一起。"}]},{"id":134,"type":"成语","words":[{"word":"广开言路","freq":5,"def":"创造条件让更多人敢说话、提意见，侧重主动打开发言渠道。"},{"word":"从善如流","freq":4,"def":"乐意接受正确的好意见，像流水一样自然顺畅，侧重接受意见的态度。"}]},{"id":135,"type":"成语","words":[{"word":"尾大不掉","freq":5,"def":"形容组织势力庞大，指挥不动下属不听调度，侧重权力结构失衡。"},{"word":"一盘散沙","freq":3,"def":"形容群体分散混乱，没有凝聚力不能团结起来，侧重组织涣散。"},{"word":"桀骜不驯","freq":1,"def":"形容人性格倔强傲慢，不服从管教，侧重个体的性格特质。"}]},{"id":136,"type":"成语","words":[{"word":"隔靴搔痒","freq":5,"def":"比喻说话、做事没有抓住关键本质，解决不了根本问题。核心问题是没触达关键。"},{"word":"张冠李戴","freq":4,"def":"比喻认错了对象，弄错了事实。核心问题是弄错了对象。"}]},{"id":137,"type":"成语","words":[{"word":"待价而沽","freq":4,"def":"等到好价钱再卖出，比喻等待合适的条件才答应任职做事，侧重等待合适的出价/条件。"},{"word":"奇货可居","freq":4,"def":"把稀有的、独特的货物囤积起来，等待高价卖出；侧重囤积稀缺资源。"}]},{"id":138,"type":"成语","words":[{"word":"纲举目张","freq":4,"def":"本义是提起渔网的总绳，所有网眼就都自然张开，核心强调抓住核心主干就能带动所有分支。"},{"word":"以一持万","freq":2,"def":"持：把握。核心强调抓住关键，可以控制全局。"}]},{"id":139,"type":"成语","words":[{"word":"一意孤行","freq":4,"def":"侧重不听劝告，执意按自己的想法行动，核心在行为层面不纠正。"},{"word":"固执己见","freq":2,"def":"侧重顽固坚持自己的观点主张，核心在观点层面不改变。"},{"word":"执迷不悟","freq":3,"def":"侧重坚持错误而不觉悟。核心在认知层面不醒悟。"}]},{"id":140,"type":"成语","words":[{"word":"弃旧图新","freq":4,"def":"抛弃旧的，谋求新的。多指由坏的转向好的。"},{"word":"去芜存菁","freq":4,"def":"侧重除杂乱，保留菁华。"},{"word":"拨乱反正","freq":4,"def":"消除混乱局面，恢复正常秩序。常用于纠正比较重大的错误。"},{"word":"激浊扬清","freq":2,"def":"侧重清除坏的，发扬好的。"}]},{"id":141,"type":"成语","words":[{"word":"耳提面命","freq":4,"def":"形容长辈热心恳切地教导。"},{"word":"言传身教","freq":3,"def":"既用言语来教导，又用行动来示范。指行动起示范作用。"}]},{"id":142,"type":"成语","words":[{"word":"文不加点","freq":4,"def":"指文章一气呵成，无须修改，即写完不用改，强调文思敏捷，写作技巧纯熟。"},{"word":"下笔千言","freq":1,"def":"形容文思敏捷，写作迅速，即写得多写得快，强调思路开阔。"}]},{"id":143,"type":"成语","words":[{"word":"指鹿为马","freq":3,"def":"故意把鹿说成马，比喻故意颠倒黑白、混淆是非，完全扭曲事实，贬义词。"},{"word":"指桑骂槐","freq":1,"def":"比喻表面上骂这个人，实际上骂那个人，核心是借甲骂乙，委婉讽刺。"},{"word":"皮里阳秋","freq":2,"def":"表面上不作任何评论，但内心里对人对事有着明确的褒贬评判。"}]},{"id":144,"type":"成语","words":[{"word":"用武之地","freq":3,"def":"侧重形容能够施展才能的地方。"},{"word":"立足之地","freq":1,"def":"侧重指可容身的地方，强调身处的环境艰难。"}]},{"id":145,"type":"成语","words":[{"word":"指日可待","freq":3,"def":"事情、希望很快就能实现，侧重结果快要到来。"},{"word":"翘首以盼","freq":3,"def":"仰着脖子等待，形容人们殷切地盼望某个事物/人出现，侧定期盼。"},{"word":"倚马可待","freq":1,"def":"靠着即将出征的战马就能很快写出文章，形容写文章的速度极快，文思敏捷。"}]},{"id":1,"type":"词语","words":[{"word":"积淀","freq":0,"def":"积累沉淀，侧重积累并沉淀下来。常搭配内涵、精神、文化等。"},{"word":"沉淀","freq":0,"def":"表示溶液中难溶解的固体物质从溶液中析出。也可表示凝聚；积累。考题中更多考查凝聚、积累之意，常搭配文化、时间、历史等。"},{"word":"积累","freq":0,"def":"（事物）逐渐聚集。侧重于积少成多、不断增加，多用于经验、知识、材料、资金等。"},{"word":"积聚","freq":0,"def":"侧重于逐渐聚合在一起，集中起来。常搭配人才、财富、力量等。"}]},{"id":2,"type":"词语","words":[{"word":"折射","freq":0,"def":"引申义是透过现象反映事物本质，相当于间接体现。考题中多用于其引申义。"},{"word":"反射","freq":0,"def":"可指光遇到障碍物后改变传播方向返回原介质的现象；也可指机体对外部刺激作出回应。"},{"word":"影射","freq":0,"def":"借甲指乙；暗指（某人某事），一般带有暗讽、间接指责的意味。"}]},{"id":3,"type":"词语","words":[{"word":"凝聚","freq":0,"def":"比喻义侧重聚合、积聚，强调将分散的小力量/情感/心血聚集起来，形成更强大的整体，语义更抽象。"},{"word":"凝结","freq":0,"def":"侧重由量变形成新的成果/形态，强调过程后生成新的东西。"},{"word":"凝固","freq":0,"def":"比喻义侧重固定不变、停滞，考题中常用其比喻义。"},{"word":"凝集","freq":0,"def":"比喻义侧重内容浓缩汇集，实际使用频率低于前三个词。"}]},{"id":4,"type":"词语","words":[{"word":"体现","freq":0,"def":"侧重某种抽象的特点通过具体的事物表现出来。"},{"word":"呈现","freq":0,"def":"侧重具体的事物在眼前显现出来。"},{"word":"表现","freq":0,"def":"可指表示出来，也可表示故意显示自己，考题中前者更常见。"}]},{"id":5,"type":"词语","words":[{"word":"反映","freq":0,"def":"比喻表现出客观事物的本质；或把情况、意见等告诉上级及有关部门。侧重表现或显现，作动词时，可带宾语。"},{"word":"反应","freq":0,"def":"指有机体受体内或体外的刺激而引起的相应的活动；也指事情所引起的意见、态度或行动。侧重做出回应，作动词时，不带宾语。"}]},{"id":6,"type":"词语","words":[{"word":"演变","freq":0,"def":"发展变化（指历时较久的），侧重变，历时较久的变化，多用于历史、语言、观念等。"},{"word":"演化","freq":0,"def":"侧重于由低级到高级的发展，多用于自然界的变化，适用范围相对较小。"},{"word":"演进","freq":0,"def":"侧重进，前进，是一种正向作用，多用于社会、历史、文明等。"}]},{"id":7,"type":"词语","words":[{"word":"体验","freq":0,"def":"指亲身经历，对原本不熟悉的情况加以认识、熟悉，从而加深理解。侧重在实践中认识事物。"},{"word":"体味","freq":0,"def":"侧重仔细玩味，反复琢磨。"},{"word":"体会","freq":0,"def":"侧重领会、理解，可以作动词，也可以作名词。"},{"word":"体察","freq":0,"def":"体验和观察，除了体验的意思外，还侧重观察。"}]},{"id":8,"type":"词语","words":[{"word":"遏制","freq":0,"def":"侧重制止，压抑控制，使不发作，强调过程。"},{"word":"遏止","freq":0,"def":"侧重用力阻止，强调结果。"}]},{"id":9,"type":"词语","words":[{"word":"记录","freq":0,"def":"侧重于通过各种手段，记下所发生的事情，从而将信息保存下来。记录的工具可以是文字和其他仪器等。"},{"word":"记载","freq":0,"def":"多侧重于利用文字对历史的客观记录，目的是记录事实、事件。记载的工具主要是文字。"},{"word":"记述","freq":0,"def":"侧重于利用文字更细致地叙述事实或过程。"}]},{"id":10,"type":"词语","words":[{"word":"培育","freq":0,"def":"培养幼小生物使其发育成长，也可指情感发展与人才培养，多用于幼小生物、抽象情感、新人。"},{"word":"培养","freq":0,"def":"强调通过训练、教育使对象达到既定目标，带有造就、养成的意味。多用于人才、能力、生物体生长。"},{"word":"扶植","freq":0,"def":"侧重给予扶助，帮助其成长，使其由弱变强。强调从旁扶助弱势对象站稳脚跟。"},{"word":"培植","freq":0,"def":"原指栽种并细心管理（植物）。也指扶植势力/培养人才使其壮大。"}]},{"id":11,"type":"词语","words":[{"word":"阻碍","freq":0,"def":"侧重使不能顺利通过或发展，可作名词或动词。"},{"word":"阻隔","freq":0,"def":"侧重隔断、隔绝。"}]},{"id":12,"type":"词语","words":[{"word":"沿用","freq":0,"def":"侧重于指继续使用，沿用的对象可以是旧有的或现行的。"},{"word":"沿袭","freq":0,"def":"指依照旧传统或原有的规定办理。侧重把过去的东西继承、传承下来。"}]},{"id":13,"type":"词语","words":[{"word":"基础","freq":0,"def":"事物发展的根本或起点，侧重指根基。"},{"word":"前提","freq":0,"def":"事物发生或发展的先决条件，侧重指必须具备的条件。"}]},{"id":14,"type":"词语","words":[{"word":"感受","freq":0,"def":"侧重接触外界事物后产生的印象、体会。更偏向于经过内心处理的、带有情绪和体验的过程或结果。"},{"word":"感触","freq":0,"def":"侧重因外界触发而内心生出的想法或感慨，比感受更深一层，常带思考。"},{"word":"感悟","freq":0,"def":"侧重通过思考得到的道理、领悟，是一种认识上的升华。"},{"word":"感觉","freq":0,"def":"侧重指感官或内心的任何感知、印象、判断。更偏向于直接的、生理或直觉上的第一反应。"}]},{"id":15,"type":"词语","words":[{"word":"放弃","freq":0,"def":"侧重丢掉，不要，可用于抽象事物，也可用于具体事物。"},{"word":"摒弃","freq":0,"def":"侧重清除掉。多指不良思想、观点、主张等抽象事物。"},{"word":"抛弃","freq":0,"def":"指扔掉不要。对象可以是抽象的事物，也可以是具体的人和物。"}]},{"id":16,"type":"词语","words":[{"word":"延伸","freq":0,"def":"延长，伸展。可用于道路等具体的线性事物，也可用于论点等抽象事物。"},{"word":"蔓延","freq":0,"def":"像蔓草一样向周围（四面八方）扩展。可用于具体事物，也可用于抽象事物。"}]},{"id":17,"type":"词语","words":[{"word":"拓展","freq":0,"def":"开拓、发展，指在原有的基础上，增加新的东西。"},{"word":"扩大","freq":0,"def":"使范围、规模等增大。侧重于容积、面积或规模上增大。"}]},{"id":18,"type":"词语","words":[{"word":"扩散","freq":0,"def":"扩大分散出去。常用于消息、言论、病毒等。"},{"word":"发散","freq":0,"def":"（光线等）由某一点向四周散开，常用于思维、光束、理念等。"}]},{"id":19,"type":"词语","words":[{"word":"矗立","freq":0,"def":"侧重高耸地站立。"},{"word":"伫立","freq":0,"def":"侧重长时间站立。"},{"word":"屹立","freq":0,"def":"像山峰一样高耸而稳固地立着，常用来比喻坚定不可动摇。"}]},{"id":20,"type":"词语","words":[{"word":"疏忽","freq":0,"def":"指因为粗心大意而没有注意到。侧重粗心大意忽略。"},{"word":"漏洞","freq":0,"def":"比喻言行等不严密的地方，强调不周密的地方，破绽。"},{"word":"疏漏","freq":0,"def":"侧重疏忽遗漏。"}]},{"id":21,"type":"词语","words":[{"word":"沉浸","freq":0,"def":"多比喻处于某种境界或思想活动中。"},{"word":"沉迷","freq":0,"def":"深深地迷恋（某种事物）。"},{"word":"沉溺","freq":0,"def":"陷入不良境地（多指坏的生活习惯），不能自拔。"},{"word":"沉醉","freq":0,"def":"比喻深深地沉浸在某种气氛或思想活动中。"}]},{"id":22,"type":"词语","words":[{"word":"构建","freq":0,"def":"建立，多用于抽象事物，比如体系、框架、理论、关系等。"},{"word":"建造","freq":0,"def":"建筑，修建，常用于具体的建筑物、基础设施。"},{"word":"构造","freq":0,"def":"作名词时，表示各个组成部分的安排、组织和相互关系；做动词时，表示建造。"},{"word":"建筑","freq":0,"def":"作动词，强调修建；做名词时，指建筑物。"}]},{"id":23,"type":"词语","words":[{"word":"依赖","freq":0,"def":"侧重于指完全借助别的人或事物，不能自立或不愿自立。"},{"word":"依托","freq":0,"def":"可指仰仗，凭借；也可指依靠的人或事。"},{"word":"依附","freq":0,"def":"侧重于从属、附着。"},{"word":"依靠","freq":0,"def":"作动词，表示靠某人或事物来达到一定的目的。作名词，指可以依靠的人或东西。"}]},{"id":24,"type":"词语","words":[{"word":"隐藏","freq":0,"def":"把人/事物藏起来，不让他人发现。"},{"word":"隐蔽","freq":0,"def":"借助外部环境将自身/目标遮盖掩藏，可作形容词或动词。"},{"word":"掩盖","freq":0,"def":"可指从上面遮住，盖住。也可以指隐藏；隐瞒。可用于具体事物，更常用于抽象事物。"}]},{"id":25,"type":"词语","words":[{"word":"回避","freq":0,"def":"有意识地让开、避开。也指因规则或利害关系主动不参与。"},{"word":"躲避","freq":0,"def":"可指故意离开或隐蔽起来，使人看不见，也可指离开对自己不利的事物。"}]},{"id":26,"type":"词语","words":[{"word":"指责","freq":0,"def":"指摘，责备。强调指出他人过失并进行批评责备。"},{"word":"谴责","freq":0,"def":"责备，严正申诉。强调对荒谬言行或错误政策进行严厉批评，带有庄重正式的色彩。"},{"word":"斥责","freq":0,"def":"侧重用严厉的语言直接指责他人的错误或罪行，偏重于言辞的尖锐性。"},{"word":"苛责","freq":0,"def":"过严地责备，强调对他人提出超出合理范围、过于严苛的责备。"}]},{"id":27,"type":"词语","words":[{"word":"质疑","freq":0,"def":"侧重提出心存的疑问，强调主动发问的行为。"},{"word":"置疑","freq":0,"def":"怀疑（多用于否定式）。如不容置疑、毋庸置疑。"},{"word":"怀疑","freq":0,"def":"心理上对事物的真实性、可靠性产生不确定的认知；除心中存疑外，还有猜测的意思。"}]},{"id":28,"type":"词语","words":[{"word":"识别","freq":0,"def":"辨别，辨认，侧重于指对个体特征加以认识，以确定性质。"},{"word":"鉴别","freq":0,"def":"侧重于通过审察而确定事物的性质或特征，评定其真假好坏。"},{"word":"甄别","freq":0,"def":"可指审查辨别（优劣、真伪），侧重于指认真审查或考核，加以辨别、判定。"},{"word":"辨别","freq":0,"def":"根据不同事物的特点，在认识上加以区别。强调对易混淆的加以区分。"}]},{"id":29,"type":"词语","words":[{"word":"象征","freq":0,"def":"用具体的事物表现某种抽象的思想、情感或精神，具体事物对应抽象含义。"},{"word":"缩影","freq":0,"def":"侧重通过具体微小的事物，反映同类型整体的特征和全貌。"},{"word":"预兆","freq":0,"def":"事前显露出来的征兆，预示未来将要发生的事情。"}]},{"id":30,"type":"词语","words":[{"word":"应用","freq":0,"def":"考题中多指把抽象的理论、技术、成果用到实际中，强调理论落地到实际场景。"},{"word":"采纳","freq":0,"def":"侧重听取、接受（意见、建议、要求等）。"},{"word":"采用","freq":0,"def":"认为合适而使用。可用于具体事物，也可用于抽象事物，搭配范围较广。"},{"word":"采取","freq":0,"def":"针对特定情况，选择实施某种方针、政策、行动，强调主动选择应对方式。"}]},{"id":31,"type":"词语","words":[{"word":"限制","freq":0,"def":"强调划定明确范围，控制在某个边界内。适用范围最广。"},{"word":"制约","freq":0,"def":"事物之间相互牵制，一方的存在/发展以另一方为条件，强调事物之间的相互影响、牵制关系。"},{"word":"抑制","freq":0,"def":"强调压下去、控制住不让发作或发展，强调主动压制的动作。"},{"w var STORAGE_KEY = "vocab_learn_v5";
var state = {tab:"learn", learnIdx:0, reviewIdx:0, reviewList:[], selectedWord:null, selectedDef:null, matched:new Set(), wrongCount:0};
var records = {};

function loadRecords() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; } }
function saveRecords() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
function getGroupStatus(id) { return records[id] || null; }

function setGroupStatus(id, mastered, correct, total, opts) {
    if (!records[id]) records[id] = {correct:0, total:0, mastered:false, consecutiveCorrect:0, hadReviewError:false, learnDone:false, lastTime:""};
    records[id].correct += correct;
    records[id].total += total;
    records[id].mastered = mastered;
    if (opts) {
        if (opts.consecutiveCorrect !== undefined) records[id].consecutiveCorrect = opts.consecutiveCorrect;
        if (opts.hadReviewError !== undefined) records[id].hadReviewError = opts.hadReviewError;
        if (opts.learnDone !== undefined) records[id].learnDone = opts.learnDone;
    }
    records[id].lastTime = new Date().toLocaleString("zh-CN");
    saveRecords();
}

function getUnmastered() { return DATA.filter(function(g){ var s = getGroupStatus(g.id); return s && !s.mastered; }); }
function getMastered() { return DATA.filter(function(g){ var s = getGroupStatus(g.id); return s && s.mastered; }); }

function getNextLearnIdx() {
    for (var i = 0; i < DATA.length; i++) {
        var s = getGroupStatus(DATA[i].id);
        // 跳过已掌握的，和在学习模式中已经做过的（不管对错）
        if (!s) return i;
        if (s.mastered || s.learnDone) continue;
        return i;
    }
    return -1;
}

function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
}

function updateHeader() {
    var total = DATA.length;
    var mastered = getMastered().length;
    var ta = 0, tc = 0;
    var keys = Object.keys(records);
    for (var i = 0; i < keys.length; i++) { ta += records[keys[i]].total; tc += records[keys[i]].correct; }
    var acc = ta > 0 ? Math.round(tc / ta * 100) : 0;
    document.getElementById("headerStats").textContent = "总进度 " + mastered + "/" + total + " 组 | 正确率 " + acc + "%";
}



/* ============ Learn / Review / Record ============ */

function renderLearn() {
    var idx = getNextLearnIdx();
    var app = document.getElementById("app");
    if (idx === -1) {
        app.innerHTML = '<div class="empty-state"><div class="icon">&#x1F3C6;</div><h2>全部学完!</h2><p>所有分组都已基本掌握，可以去复习模式巩固</p></div>';
        return;
    }
    state.learnIdx = idx;
    renderGroup(idx, "learn");
}

function buildReviewList() {
    state.reviewList = [];
    for (var i = 0; i < DATA.length; i++) {
        var s = getGroupStatus(DATA[i].id);
        if (s && !s.mastered) state.reviewList.push(i);
    }
}

function renderReview() {
    var app = document.getElementById("app");
    buildReviewList();
    if (state.reviewList.length === 0) {
        app.innerHTML = '<div class="empty-state"><div class="icon">&#x1F389;</div><h2>没有需要复习的!</h2><p>所有做过的分组都已掌握，继续学习新词吧</p></div>';
        return;
    }
    state.reviewIdx = 0;
    renderGroup(state.reviewList[0], "review");
}

function renderGroup(idx, mode) {
    var app = document.getElementById("app");
    var group = DATA[idx];
    var words = group.words.map(function(w, i){ return {word:w.word, freq:w.freq, def:w.def, origIdx:i}; });
    var shuffledDefs = shuffle(words);
    state.selectedWord = null; state.selectedDef = null; state.matched = new Set(); state.wrongCount = 0;

    var total = DATA.length;
    var mastered = getMastered().length;
    var progress = Math.round(mastered / total * 100);
    var modeLabel = mode === "learn" ? "学习中" : "复习中";

    var html = '<div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div>';
    html += '<div class="group-header"><div><span class="group-title">第 ' + group.id + ' 组</span> <span class="group-type ' + (group.type === "成语" ? "cy" : "") + '">' + group.type + '</span></div><div style="font-size:12px;color:#999">' + modeLabel + ' | ' + mastered + '/' + total + '</div></div>';
    html += '<div class="hint-text">点击左侧词语，再点右侧对应释义连线 | 连错: <span class="wrong-count" id="wrongCounter">0</span></div>';
    html += '<div class="match-area"><div class="col"><div class="col-label">词语</div>';
    for (var i = 0; i < words.length; i++) {
        var w = words[i];
        var freqTag = w.freq > 0 ? '<span class="freq-tag">考频' + w.freq + '</span>' : "";
        html += '<div class="word-card" data-idx="' + w.origIdx + '" onclick="selectWord(this,' + w.origIdx + ')">' + w.word + freqTag + '</div>';
    }
    html += '</div><div class="col"><div class="col-label">释义</div>';
    for (var i = 0; i < shuffledDefs.length; i++) {
        var w = shuffledDefs[i];
        html += '<div class="def-card" data-idx="' + w.origIdx + '" onclick="selectDef(this,' + w.origIdx + ')">' + w.def + '</div>';
    }
    html += '</div></div>';
    html += '<div class="btn-row">';
    if (mode === "learn") html += '<button class="btn btn-secondary btn-sm" onclick="skipGroup()">跳过这组</button>';
    html += '</div>';
    app.innerHTML = html;
}

function selectWord(el, idx) {
    if (el.classList.contains("matched")) return;
    if (state.selectedWord !== null && state.selectedWord === idx) { el.classList.remove("selected"); state.selectedWord = null; return; }
    var sel = document.querySelectorAll(".word-card.selected");
    for (var i = 0; i < sel.length; i++) sel[i].classList.remove("selected");
    el.classList.add("selected"); state.selectedWord = idx; tryMatch();
}
window.selectWord = selectWord;

function selectDef(el, idx) {
    if (el.classList.contains("matched")) return;
    if (state.selectedDef !== null && state.selectedDef === idx) { el.classList.remove("selected"); state.selectedDef = null; return; }
    var sel = document.querySelectorAll(".def-card.selected");
    for (var i = 0; i < sel.length; i++) sel[i].classList.remove("selected");
    el.classList.add("selected"); state.selectedDef = idx; tryMatch();
}
window.selectDef = selectDef;

function tryMatch() {
    if (state.selectedWord === null || state.selectedDef === null) return;
    var wordIdx = state.selectedWord, defIdx = state.selectedDef;
    var wordEl = document.querySelector('.word-card[data-idx="' + wordIdx + '"]');
    var defEl = document.querySelector('.def-card[data-idx="' + defIdx + '"]');
    if (wordIdx === defIdx) {
        wordEl.classList.remove("selected"); defEl.classList.remove("selected");
        wordEl.classList.add("matched"); defEl.classList.add("matched");
        state.matched.add(wordIdx); state.selectedWord = null; state.selectedDef = null;
        var groupIdx = state.tab === "learn" ? state.learnIdx : state.reviewIdx;
        if (state.matched.size === DATA[groupIdx].words.length) setTimeout(finishGroup, 300);
    } else {
        wordEl.classList.add("wrong"); defEl.classList.add("wrong");
        wordEl.classList.remove("selected"); defEl.classList.remove("selected");
        state.selectedWord = null; state.selectedDef = null; state.wrongCount++;
        var wc = document.getElementById("wrongCounter"); if (wc) wc.textContent = state.wrongCount;
        setTimeout(function(){ wordEl.classList.remove("wrong"); defEl.classList.remove("wrong"); }, 500);
    }
}

function finishGroup() {
    var idx = state.tab === "learn" ? state.learnIdx : state.reviewList[state.reviewIdx];
    var group = DATA[idx];
    var hadWrong = state.wrongCount > 0;
    var correct = Math.max(0, group.words.length - state.wrongCount);
    var isReview = state.tab === "review";
    var mastered = false;
    var consecutiveCorrect = 0;
    var prev = records[group.id] || {};
    var hadReviewError = prev.hadReviewError || false;

    if (isReview) {
        hadReviewError = prev.hadReviewError || false;
        if (hadWrong) {
            mastered = false;
            consecutiveCorrect = 0;
            hadReviewError = true;
        } else if (hadReviewError) {
            var prevCC = prev.consecutiveCorrect || 0;
            consecutiveCorrect = prevCC + 1;
            mastered = consecutiveCorrect >= 2;
        } else {
            mastered = true;
            consecutiveCorrect = 1;
        }
        setGroupStatus(group.id, mastered, correct, group.words.length, {consecutiveCorrect: consecutiveCorrect, hadReviewError: hadReviewError});
    } else {
        // 学习模式：做完就标记 learnDone，不再出现在学习模式
        var wasWrongBefore = prev && prev.total > 0 && !prev.mastered;
        if (hadWrong) {
            mastered = false;
            consecutiveCorrect = 0;
        } else if (wasWrongBefore) {
            mastered = false;
            consecutiveCorrect = 1;
        } else {
            mastered = true;
            consecutiveCorrect = 1;
        }
        setGroupStatus(group.id, mastered, correct, group.words.length, {consecutiveCorrect: consecutiveCorrect, hadReviewError: hadReviewError, learnDone: true});
    }
    updateHeader();
    showResult(mastered, consecutiveCorrect, isReview, hadReviewError);
}

function showResult(mastered, consecutiveCorrect, isReview, hadReviewError) {
    var overlay = document.getElementById("resultOverlay");
    var box = document.getElementById("resultBox");
    if (mastered) {
        box.innerHTML = '<div class="icon">&#x2705;</div><h2 style="color:#27ae60">基本掌握!</h2><p>全部连线正确，已标记为基本掌握</p><button class="btn btn-green" onclick="nextGroup()">下一组</button>';
    } else if (!isReview && consecutiveCorrect > 0) {
        // 学习模式：做错后重做对了，归入复习
        box.innerHTML = '<div class="icon">&#x1F4AA;</div><h2 style="color:#f39c12">答对了!</h2><p>已加入复习列表，方便下次复习巩固</p><button class="btn btn-primary" onclick="nextGroup()">继续</button>';
    } else if (isReview && hadReviewError && consecutiveCorrect > 0) {
        // 复习模式：之前错过，这次对了，还需再做对几次
        box.innerHTML = '<div class="icon">&#x1F4AA;</div><h2 style="color:#f39c12">答对了! (' + consecutiveCorrect + '/2)</h2><p>再连续答对 ' + (2 - consecutiveCorrect) + ' 次即可掌握</p><button class="btn btn-primary" onclick="nextGroup()">继续</button>';
    } else {
        box.innerHTML = '<div class="icon">&#x274C;</div><h2 style="color:#e74c3c">未掌握</h2><p>有连线错误，继续归入复习</p><button class="btn btn-primary" onclick="nextGroup()">继续</button>';
    }
    overlay.classList.add("show");
}

function nextGroup() {
    document.getElementById("resultOverlay").classList.remove("show");
    if (state.tab === "learn") {
        renderLearn();
    } else {
        var prevGroupIdx = state.reviewList[state.reviewIdx];
        buildReviewList();
        if (state.reviewList.length === 0) {
            renderReview();
            return;
        }
        // Check if the just-completed group was mastered (removed from list)
        var pos = state.reviewList.indexOf(prevGroupIdx);
        if (pos === -1) {
            // Group was mastered and removed - current index is correct (next group shifted into position)
            if (state.reviewIdx >= state.reviewList.length) state.reviewIdx = 0;
        } else {
            // Group is still in list - move to next
            state.reviewIdx = pos + 1;
            if (state.reviewIdx >= state.reviewList.length) state.reviewIdx = 0;
        }
        renderGroup(state.reviewList[state.reviewIdx], "review");
    }
}
window.nextGroup = nextGroup;

function skipGroup() {
    var idx = state.learnIdx, group = DATA[idx];
    if (!records[group.id]) records[group.id] = {correct:0, total:0, mastered:false, lastTime:""};
    records[group.id].lastTime = new Date().toLocaleString("zh-CN") + " (跳过)";
    saveRecords();
    var nextIdx = -1;
    for (var i = idx + 1; i < DATA.length; i++) { var s = getGroupStatus(DATA[i].id); if (!s || !s.mastered) { nextIdx = i; break; } }
    if (nextIdx === -1) { for (var i = 0; i < idx; i++) { var s = getGroupStatus(DATA[i].id); if (!s || !s.mastered) { nextIdx = i; break; } } }
    if (nextIdx === -1) { renderLearn(); return; }
    state.learnIdx = nextIdx; renderGroup(nextIdx, "learn");
}
window.skipGroup = skipGroup;

/* ============ Record ============ */

function renderRecord() {
    var app = document.getElementById("app");
    var totalGroups = DATA.length, masteredCount = getMastered().length;
    var ta = 0, tc = 0;
    var keys = Object.keys(records);
    for (var i = 0; i < keys.length; i++) { ta += records[keys[i]].total; tc += records[keys[i]].correct; }
    var acc = ta > 0 ? Math.round(tc / ta * 100) : 0;
    var unmasteredCount = getUnmastered().length;
    var newCount = 0;
    for (var i = 0; i < DATA.length; i++) { if (!getGroupStatus(DATA[i].id)) newCount++; }

    var html = '<div class="summary-cards">';
    html += '<div class="summary-card"><div class="num">' + totalGroups + '</div><div class="label">总组数</div></div>';
    html += '<div class="summary-card"><div class="num" style="color:#27ae60">' + masteredCount + '</div><div class="label">已掌握</div></div>';
    html += '<div class="summary-card"><div class="num" style="color:#e74c3c">' + unmasteredCount + '</div><div class="label">未掌握</div></div>';
    html += '<div class="summary-card"><div class="num" style="color:#3498db">' + acc + '%</div><div class="label">正确率</div></div>';
    html += '</div>';

    html += '<div class="filter-bar">';
    html += '<button class="filter-btn active" data-filter="all">全部</button>';
    html += '<button class="filter-btn" data-filter="mastered">已掌握</button>';
    html += '<button class="filter-btn" data-filter="unmastered">未掌握</button>';
    html += '<button class="filter-btn" data-filter="new">未学习(' + newCount + ')</button>';
    html += '</div>';
    html += '<div id="recordList" style="max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch"></div>';

    html += '<div class="btn-row" style="margin-top:16px">';
    html += '<button class="btn btn-sm btn-outline" onclick="exportProgress()">导出进度</button>';
    html += '<button class="btn btn-sm btn-outline" onclick="document.getElementById(\'importFile\').click()">导入进度</button>';
    html += '<button class="btn btn-sm btn-outline" style="color:#e74c3c;border-color:#e74c3c" onclick="resetProgress()">重置进度</button>';
    html += '<input type="file" id="importFile" accept=".json" style="display:none" onchange="importProgress(event)">';
    html += '</div>';

    app.innerHTML = html;

    var filterBtns = document.querySelectorAll(".filter-btn");
    for (var i = 0; i < filterBtns.length; i++) {
        (function(btn) {
            btn.addEventListener("click", function() {
                var allBtns = document.querySelectorAll(".filter-btn");
                for (var j = 0; j < allBtns.length; j++) allBtns[j].classList.remove("active");
                btn.classList.add("active");
                renderRecordList(btn.getAttribute("data-filter"));
            });
        })(filterBtns[i]);
    }
    renderRecordList("all");
}

function renderRecordList(filter) {
    var filtered = [];
    for (var i = 0; i < DATA.length; i++) {
        var s = getGroupStatus(DATA[i].id);
        if (filter === "mastered" && s && s.mastered) filtered.push(DATA[i]);
        else if (filter === "unmastered" && s && !s.mastered) filtered.push(DATA[i]);
        else if (filter === "new" && !s) filtered.push(DATA[i]);
        else if (filter === "all") filtered.push(DATA[i]);
    }
    if (filtered.length === 0) {
        document.getElementById("recordList").innerHTML = '<div class="empty-state"><p>没有符合条件的数据</p></div>';
        return;
    }
    var html = '<div style="overflow-x:auto"><table class="record-table"><thead><tr><th>组号</th><th>类型</th><th>词语</th><th>正确/总</th><th>正确率</th><th>状态</th></tr></thead><tbody>';
    for (var i = 0; i < filtered.length; i++) {
        var g = filtered[i], s = getGroupStatus(g.id);
        var words = []; for (var j = 0; j < g.words.length; j++) words.push(g.words[j].word);
        var wordsStr = words.join(" / ");
        if (s) {
            var acc = s.total > 0 ? Math.round(s.correct / s.total * 100) : 0;
            var badge = s.mastered ? '<span class="badge badge-green">已掌握</span>' : ('<span class="badge badge-red">未掌握</span>' + (s.hadReviewError && s.consecutiveCorrect ? ' <span style="font-size:11px;color:#f39c12">' + s.consecutiveCorrect + '/2</span>' : ''));
            html += '<tr><td>' + g.id + '</td><td>' + g.type + '</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + wordsStr + '</td><td>' + s.correct + '/' + s.total + '</td><td>' + acc + '%</td><td>' + badge + '</td></tr>';
        } else {
            html += '<tr><td>' + g.id + '</td><td>' + g.type + '</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + wordsStr + '</td><td>-</td><td>-</td><td><span class="badge badge-gray">未学习</span></td></tr>';
        }
    }
    html += '</tbody></table></div>';
    document.getElementById("recordList").innerHTML = html;
}

/* ============ Export/Import ============ */

window.exportProgress = function() {
    var blob = new Blob([JSON.stringify(records, null, 2)], {type: "application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "vocab_progress_" + new Date().toISOString().slice(0,10) + ".json";
    a.click(); URL.revokeObjectURL(url);
};

window.importProgress = function(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var data = JSON.parse(e.target.result);
            records = data;
            saveRecords();
            updateHeader();
            alert("导入成功!");
        } catch(err) {
            alert("文件格式错误");
        }
    };
    reader.readAsText(file);
};

window.resetProgress = function() {
    if (!confirm("确定要重置所有学习进度吗？此操作不可撤销！")) return;
    records = {};
    saveRecords();
    updateHeader();
    switchTab("record");
    alert("进度已重置");
};

/* ============ Tab Switching ============ */

function switchTab(tab) {
    state.tab = tab;
    var tabs = document.querySelectorAll(".tab");
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove("active");
    document.querySelector('.tab[data-tab="' + tab + '"]').classList.add("active");
    if (tab === "learn") renderLearn();
    else if (tab === "review") renderReview();
    else if (tab === "record") renderRecord();
}

var tabEls = document.querySelectorAll(".tab");
for (var i = 0; i < tabEls.length; i++) {
    (function(t) { t.addEventListener("click", function() { switchTab(t.getAttribute("data-tab")); }); })(tabEls[i]);
}

/* ============ Init ============ */
records = loadRecords();
updateHeader();
renderLearn();
</script>
</body>
</html>
